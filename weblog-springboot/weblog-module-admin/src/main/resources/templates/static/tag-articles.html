<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tagName} + ' - ' + ${blogName}">标签文章</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link th:href="${baseUrl} + 'assets/css/article.css'" rel="stylesheet">
    <link rel="icon" th:href="${blogLogo}" type="image/x-icon">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div th:replace="~{static/fragments/header :: header}"></div>

    <main class="container max-w-screen-xl mx-auto p-4">
        <div class="grid grid-cols-4 gap-7">
            <div class="col-span-4 md:col-span-3">
                <div class="bg-white border border-gray-200 rounded-lg p-6 mb-4 dark:bg-gray-800 dark:border-gray-700">
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
                        标签: <span th:text="${tagName}">标签名</span>
                    </h1>
                </div>

                <div th:each="article : ${articles}" class="mb-4 bg-white border border-gray-200 rounded-lg overflow-hidden dark:bg-gray-800 dark:border-gray-700">
                    <a th:href="${baseUrl} + 'article/' + ${article.id} + '/index.html'" class="block p-5">
                        <h2 class="text-lg font-bold text-gray-900 mb-2 dark:text-white" th:text="${article.title}">标题</h2>
                        <p class="text-sm text-gray-500 mb-2 line-clamp-2" th:text="${article.summary}">摘要</p>
                        <div class="text-xs text-gray-400">
                            <span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd')}">日期</span>
                            <span class="ml-3" th:text="'阅读 ' + ${article.readNum}">阅读</span>
                        </div>
                    </a>
                </div>

                <div th:replace="~{static/fragments/pagination :: pagination}"></div>
            </div>

            <aside class="hidden md:block md:col-span-1">
                <div class="sticky top-[5.5rem]">
                    <div th:replace="~{static/fragments/sidebar :: sidebar}"></div>
                </div>
            </aside>
        </div>
    </main>

    <div th:replace="~{static/fragments/footer :: footer}"></div>
</body>
</html>

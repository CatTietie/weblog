<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${blogName} + ' - 首页'">博客</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link th:href="${baseUrl} + 'assets/css/article.css'" rel="stylesheet">
    <link rel="icon" th:href="${blogLogo}" type="image/x-icon">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div th:replace="~{static/fragments/header :: header}"></div>

    <main class="container max-w-screen-xl mx-auto p-4">
        <div class="grid grid-cols-4 gap-7">
            <!-- 主内容区 -->
            <div class="col-span-4 md:col-span-3">
                <!-- 文章列表 -->
                <div th:each="article : ${articles}" class="mb-4 bg-white border border-gray-200 rounded-lg overflow-hidden dark:bg-gray-800 dark:border-gray-700">
                    <a th:href="${baseUrl} + 'article/' + ${article.id} + '/index.html'" class="block">
                        <div class="flex flex-col md:flex-row">
                            <div th:if="${article.cover}" class="md:w-48 h-32 md:h-auto flex-shrink-0">
                                <img th:src="${article.cover}" class="w-full h-full object-cover" alt="">
                            </div>
                            <div class="p-5 flex-1">
                                <h2 class="text-xl font-bold text-gray-900 mb-2 dark:text-white" th:text="${article.title}">标题</h2>
                                <p class="text-sm text-gray-500 mb-3 line-clamp-2" th:text="${article.summary}">摘要</p>
                                <div class="flex items-center text-xs text-gray-400 space-x-4">
                                    <span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd')}">日期</span>
                                    <span th:text="'阅读 ' + ${article.readNum}">阅读</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- 分页 -->
                <div th:replace="~{static/fragments/pagination :: pagination}"></div>
            </div>

            <!-- 右侧边栏 -->
            <aside class="hidden md:block md:col-span-1">
                <div class="sticky top-[5.5rem]">
                    <div th:replace="~{static/fragments/sidebar :: sidebar}"></div>
                </div>
            </aside>
        </div>
    </main>

    <div th:replace="~{static/fragments/footer :: footer}"></div>
</body>
</html>

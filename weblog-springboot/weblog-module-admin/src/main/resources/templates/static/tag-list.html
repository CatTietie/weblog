<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'标签 - ' + ${blogName}">标签</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" th:href="${blogLogo}" type="image/x-icon">
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div th:replace="~{static/fragments/header :: header}"></div>

    <main class="container max-w-screen-xl mx-auto p-4">
        <div class="grid grid-cols-4 gap-7">
            <div class="col-span-4 md:col-span-3">
                <div class="bg-white border border-gray-200 rounded-lg p-6 dark:bg-gray-800 dark:border-gray-700">
                    <h1 class="text-2xl font-bold text-gray-900 mb-6 dark:text-white">全部标签</h1>
                    <div class="flex flex-wrap gap-3">
                        <a th:each="tag : ${tags}"
                           th:href="${baseUrl} + 'tag/' + ${tag.id} + '/index.html'"
                           class="inline-flex items-center px-4 py-2 bg-blue-50 text-blue-600 rounded-full hover:bg-blue-100 transition text-sm dark:bg-blue-900 dark:text-blue-200">
                            <span th:text="${tag.name}">标签名</span>
                            <span class="ml-2 bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-xs" th:text="${tag.articleCount}">0</span>
                        </a>
                    </div>
                </div>
            </div>

            <aside class="hidden md:block md:col-span-1">
                <div class="sticky top-[5.5rem]">
                    <div th:replace="~{static/fragments/sidebar :: sidebar}"></div>
                </div>
            </aside>
        </div>
    </main>

    <div th:replace="~{static/fragments/footer :: footer}"></div>
</body>
</html>

<nav th:fragment="pagination" aria-label="Page navigation" class="mt-6 flex justify-center" th:if="${totalPages > 1}">
    <ul class="inline-flex items-center -space-x-px">
        <li th:if="${currentPage > 1}">
            <a th:href="${paginationBaseUrl} + (${currentPage == 2} ? 'index.html' : 'page/' + (${currentPage} - 1) + '/index.html')"
               class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700">
                上一页
            </a>
        </li>
        <li th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a th:href="${i == 1} ? ${paginationBaseUrl} + 'index.html' : ${paginationBaseUrl} + 'page/' + ${i} + '/index.html'"
               th:text="${i}"
               th:class="${i == currentPage} ? 'px-3 py-2 leading-tight text-blue-600 bg-blue-50 border border-gray-300 hover:bg-blue-100' : 'px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700'">
                1
            </a>
        </li>
        <li th:if="${currentPage < totalPages}">
            <a th:href="${paginationBaseUrl} + 'page/' + (${currentPage} + 1) + '/index.html'"
               class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700">
                下一页
            </a>
        </li>
    </ul>
</nav>

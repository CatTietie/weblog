<div th:fragment="sidebar">
    <!-- 博主信息卡片 -->
    <div class="bg-white border border-gray-200 rounded-lg p-5 mb-4 dark:bg-gray-800 dark:border-gray-700">
        <div class="flex flex-col items-center">
            <img th:src="${blogAvatar}" class="w-20 h-20 rounded-full mb-3" alt="Avatar" th:if="${blogAvatar}">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white" th:text="${blogAuthor}">作者</h3>
            <p class="text-sm text-gray-500 mt-2 text-center" th:text="${blogIntroduction}"></p>
        </div>
    </div>

    <!-- 分类列表 -->
    <div class="bg-white border border-gray-200 rounded-lg p-5 mb-4 dark:bg-gray-800 dark:border-gray-700">
        <h3 class="text-base font-bold text-gray-900 mb-3 dark:text-white">分类</h3>
        <div class="space-y-2">
            <a th:each="cat : ${categories}"
               th:href="${baseUrl} + 'category/' + ${cat.id} + '/index.html'"
               class="flex justify-between items-center text-sm text-gray-600 hover:text-blue-600 dark:text-gray-300">
                <span th:text="${cat.name}">分类名</span>
                <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-xs" th:text="${cat.articleCount}">0</span>
            </a>
        </div>
    </div>

    <!-- 标签列表 -->
    <div class="bg-white border border-gray-200 rounded-lg p-5 dark:bg-gray-800 dark:border-gray-700">
        <h3 class="text-base font-bold text-gray-900 mb-3 dark:text-white">标签</h3>
        <div class="flex flex-wrap gap-2">
            <a th:each="tag : ${tags}"
               th:href="${baseUrl} + 'tag/' + ${tag.id} + '/index.html'"
               class="inline-block bg-blue-50 text-blue-600 text-xs px-3 py-1 rounded-full hover:bg-blue-100 dark:bg-blue-900 dark:text-blue-200">
                <span th:text="${tag.name}">标签名</span>
            </a>
        </div>
    </div>
</div>

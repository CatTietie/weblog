spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  datasource:
    #  指定数据库驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接信息
    url: jdbc:mysql://localhost:3306/weblog-cat?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: root
    password: 123456
    hikari: # 数据库连接池使用 Hikari
      minimum-idle: 5 # 连接池中最小空闲连接数
      maximum-pool-size: 20 # 连接池中允许的最大连接数
      auto-commit: true # 是否自动提交事务
      idle-timeout: 30000 # 连接在连接池中闲置的最长时间，超过这个时间会被释放。
      pool-name: Weblog-HikariCP # 自定义连接池的名字
      max-lifetime: 1800000 # 连接在连接池中的最大存活时间，超过这个时间会被强制关闭。
      connection-timeout: 30000 # 连接的超时时间
      connection-test-query: SELECT 1 # 用于测试连接是否可用的SQL查询


#=================================================================
# 邮件服务 (投递状态变更通知)
#=================================================================
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:your-email@qq.com}
    password: ${MAIL_PASSWORD:your-smtp-authorization-code}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

#=================================================================
# 管理员邮箱 (邮件发送失败时接收告警)
#=================================================================
weblog:
  mail:
    admin-email: ${ADMIN_EMAIL:admin@example.com}
  site-url: ${SITE_URL:http://localhost:8080}

#=================================================================
# 阿里云 OSS (上传图片需要，密钥从环境变量读取)
#=================================================================
aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    accessKeyId: your-access-key-id
    accessKeySecret: your-access-key-secret
    bucketName: weblog-dev
    domain: weblog-dev.oss-cn-beijing.aliyuncs.com
